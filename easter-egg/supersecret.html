<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07070b">
<meta name="robots" content="noindex">
<title>Crypte Néon — page secrète</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="css/supersecret.css">
</head>
<body>

<div class="topbar">
  <a href="../index.html">← Retour au portfolio</a>
  <span class="topbar-title">// ZONE SECRÈTE · CRYPTE NÉON</span>
  <span class="topbar-actions">
    <button type="button" id="btn-mute">Son : on</button>
    <button type="button" id="btn-fs">Plein écran</button>
  </span>
</div>

<div id="stage">
  <canvas id="game" aria-label="Crypte Néon, jeu d'action en 2D"></canvas>
  <div id="ov" class="ov"></div>

  <div id="touch" aria-hidden="true">
    <div class="pad pad-l">
      <button type="button" class="tb" data-k="T_left">◀</button>
      <button type="button" class="tb" data-k="T_right">▶</button>
      <button type="button" class="tb small" data-k="T_down">▼</button>
    </div>
    <div class="pad pad-r">
      <button type="button" class="tb small" data-k="T_use">Prendre</button>
      <button type="button" class="tb small" data-k="T_heal">Soin</button>
      <button type="button" class="tb small" data-k="T_swap">Arme</button>
      <button type="button" class="tb small" data-k="T_sk1">Comp 1</button>
      <button type="button" class="tb small" data-k="T_sk2">Comp 2</button>
      <button type="button" class="tb small" data-k="T_roll">Roul.</button>
      <button type="button" class="tb big" data-k="T_attack">Atq</button>
      <button type="button" class="tb big" data-k="T_up">Saut</button>
    </div>
  </div>
</div>

<p class="hint">ZQSD / flèches : courir · Z/↑/Espace : sauter (×2, mural) · J : attaquer / bloquer · K : rouler · R : changer d'arme · U / I : compétences · F : prendre · E : soigner · Échap : pause</p>

<noscript><p class="hint">Ce jeu nécessite JavaScript.</p></noscript>
<script src="js/supersecret.js"></script>
</body>
</html>
